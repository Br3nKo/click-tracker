[alembic]
script_location = alembic
prepend_sys_path = .
# The actual URL is injected from app.config in alembic/env.py; this is only a
# placeholder so Alembic does not complain when no DATABASE_URL is set.
sqlalchemy.url = postgresql+asyncpg://clicks:clicks@localhost:5432/clicks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
